name: Verify deployed site

# Thirty minutes behind the data updater (which runs at :17), so a deploy
# triggered by its commit has long since finished. A normal Pages deploy takes
# well under a minute.
#
# This catches the failure the updater cannot see: Pages accepting a build and
# then stalling, leaving the site serving an older copy of itself. Nothing is
# down in that state and no workflow we own fails, so without this the only
# signal is an email about GitHub's own pages-build-deployment run.
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Compares a hash of each tracked file against the same file fetched
      # from the live site. Fails the job on any mismatch, which is what
      # sends the notification.
      - name: Compare live site against this commit
        run: node verify-deploy.js

      # Different question: the site can serve exactly what the repo holds
      # and still be wrong. A countdown sat on 00:00:00 for four days after
      # its album shipped, with every file matching and every job green.
      # Runs even if the step above failed, so one run reports both.
      - name: Check the content still makes sense
        if: always()
        run: node check-content.js
